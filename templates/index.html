<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Chatbot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .chat-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            height: 75vh;
            display: flex;
            flex-direction: column;
        }

        .sample-questions {
            background: #f8f9fa;
            padding: 15px 20px;
            border-bottom: 1px solid #e0e0e0;
        }

        .sample-btn {
            display: inline-block;
            background: white;
            border: 1px solid #ddd;
            padding: 5px 12px;
            margin: 5px 5px 5px 0;
            border-radius: 15px;
            font-size: 0.85em;
            cursor: pointer;
        }

        .sample-btn:hover {
            background: #667eea;
            color: white;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f5f5f5;
        }

        .message {
            margin-bottom: 20px;
        }

        .message.user {
            text-align: right;
        }

        .message-content {
            display: inline-block;
            padding: 12px 18px;
            border-radius: 18px;
            max-width: 80%;
        }

        .message.user .message-content {
            background: #667eea;
            color: white;
            text-align: left;
        }

        .message.bot .message-content {
            background: white;
            color: #333;
            text-align: left;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .sql-query {
            background: #2d3748;
            color: #68d391;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            overflow-x: auto;
        }

        .results-table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
            font-size: 0.9em;
        }

        .results-table th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
        }

        .results-table td {
            padding: 10px 12px;
            border-bottom: 1px solid #e0e0e0;
        }

        .answer-text {
            background: #e8f5e9;
            padding: 15px;
            border-radius: 8px;
            margin: 10px 0;
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        #questionInput {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 1em;
            outline: none;
        }

        #sendBtn {
            padding: 15px 35px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1em;
            cursor: pointer;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 SQL Chatbot</h1>
            <p>Ask questions about your database in plain English</p>
        </div>

        <div class="chat-container">
            <div class="sample-questions">
                <h3>💡 Try asking:</h3>
                <div id="sampleQuestions"></div>
            </div>

            <div class="messages" id="messages">
                <div style="text-align: center; padding: 40px; color: #666;">
                    <h2>👋 Welcome!</h2>
                    <p>Ask me anything about the Northwind database</p>
                </div>
            </div>

            <div class="loading" id="loading">
                <div class="spinner"></div>
                <p style="margin-top: 10px;">Thinking...</p>
            </div>

            <div class="input-area">
                <input type="text" id="questionInput" placeholder="Ask a question...">
                <button id="sendBtn">Send</button>
            </div>
        </div>
    </div>

    <script>
        const messagesDiv = document.getElementById('messages');
        const questionInput = document.getElementById('questionInput');
        const sendBtn = document.getElementById('sendBtn');
        const loading = document.getElementById('loading');

        fetch('/sample-questions')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('sampleQuestions');
                data.samples.forEach(q => {
                    const btn = document.createElement('span');
                    btn.className = 'sample-btn';
                    btn.textContent = q;
                    btn.onclick = () => {
                        questionInput.value = q;
                        sendQuestion();
                    };
                    container.appendChild(btn);
                });
            });

        questionInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendQuestion();
            }
        });

        sendBtn.addEventListener('click', sendQuestion);

        function sendQuestion() {
            const question = questionInput.value.trim();
            if (!question) return;

            const welcome = document.querySelector('.messages > div');
            if (welcome) welcome.remove();

            addMessage('user', question);
            questionInput.value = '';
            questionInput.disabled = true;
            sendBtn.disabled = true;
            loading.classList.add('active');

            fetch('/query', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ question: question })
            })
            .then(res => res.json())
            .then(data => {
                loading.classList.remove('active');
                questionInput.disabled = false;
                sendBtn.disabled = false;
                questionInput.focus();

                if (data.error) {
                    addBotResponse(null, null, data.error);
                } else {
                    addBotResponse(data.sql, data.results, data.answer);
                }
            })
            .catch(err => {
                loading.classList.remove('active');
                questionInput.disabled = false;
                sendBtn.disabled = false;
                addBotResponse(null, null, 'Error: ' + err.message);
            });
        }

        function addMessage(type, text) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.innerHTML = `<div class="message-content">${text}</div>`;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function addBotResponse(sql, results, answer) {
            const div = document.createElement('div');
            div.className = 'message bot';
            let html = '<div class="message-content">';

            if (sql) {
                html += `<div class="sql-query">${sql}</div>`;
            }

            if (results && results.success && results.rows && results.rows.length > 0) {
                html += '<table class="results-table"><thead><tr>';
                results.columns.forEach(col => {
                    html += `<th>${col}</th>`;
                });
                html += '</tr></thead><tbody>';
                results.rows.slice(0, 10).forEach(row => {
                    html += '<tr>';
                    results.columns.forEach(col => {
                        html += `<td>${row[col]}</td>`;
                    });
                    html += '</tr>';
                });
                html += '</tbody></table>';
            }

            if (answer) {
                html += `<div class="answer-text">${answer}</div>`;
            }

            html += '</div>';
            div.innerHTML = html;
            messagesDiv.appendChild(div);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }
    </script>
</body>
</html>
